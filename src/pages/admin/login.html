<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login Admin | Masjid Syukur Ampel Boyolali</title>
  <meta name="description" content="Masuk ke panel administrator untuk mengelola konten dan jadwal Masjid Syukur Ampel Boyolali.">
  <meta name="theme-color" content="#092847">
  <link rel="icon" href="../../../assets/images/logo.jpg" type="image/jpeg">
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,500;7..72,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/style.css">
  <link rel="stylesheet" href="../../css/admin.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../../js/core/supabase-client.js"></script>
  <script src="../../js/core/data-store.js"></script>
  <script type="module" src="./login.js"></script>
</head>
<body class="login-body">

  <div class="login-card">
    <div class="login-header">
      <div class="login-logo">
        <img src="../../../assets/images/logo.jpg" alt="Logo Masjid Syukur Ampel">
      </div>
      <h1>Panel Pengurus</h1>
      <p>Masjid Syukur Ampel Boyolali</p>
      <span class="login-badge">Portal Administrator</span>
    </div>

    <!-- Alert notifikasi kesalahan -->
    <div class="alert-message alert-danger" id="login-alert" role="alert">
      <span class="alert-text">Username atau password tidak valid!</span>
    </div>

    <form id="form-login" autocomplete="off">
      <div class="form-group">
        <label class="form-label" for="username">Email Akun Admin</label>
        <div class="input-with-icon">
          <input type="email" id="username" class="form-control" placeholder="Masukkan email yang terdaftar" required autofocus autocomplete="username">
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <div class="input-with-icon">
          <input type="password" id="password" class="form-control" placeholder="Masukkan password" required>
          <button type="button" class="btn-toggle-eye" id="toggle-password" aria-label="Tampilkan atau sembunyikan password">
            <svg id="eye-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </div>
      </div>

      <div class="form-group" style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 24px;">
        <label class="form-checkbox">
          <input type="checkbox" id="remember-me" checked>
          <span>Ingat saya di perangkat ini</span>
        </label>
      </div>

      <button type="submit" class="btn btn--primary" id="btn-submit" style="width: 100%; border-radius: var(--radius-sm);">
        <span id="btn-text">Masuk ke Dashboard</span>
      </button>
    </form>

    <div class="login-footer-links">
      <a href="../home/index.html">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
        Kembali ke Beranda Website
      </a>
    </div>
  </div>
  </script>
</body>
</html>
